<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转到小程序...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .jump-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }
        .loading {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .title {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .subtitle {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .retry-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="jump-container">
        <div class="loading"></div>
        <div class="title">正在跳转到小程序</div>
        <div class="subtitle">请在微信内打开，稍候自动跳转</div>
        <div id="errorMsg" class="error" style="display: none;"></div>
        <button id="retryBtn" class="retry-btn" style="display: none;" onclick="retryJump()">
            重新跳转
        </button>
    </div>

    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script>
        const state = { params: null, jsSdkReady: false };

        function getQueryParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                appId: urlParams.get('appId') || 'wx0b1ce2aa786ec457',
                productId: urlParams.get('productId'),
                linkCode: urlParams.get('linkCode'),
                partnerOrderNo: urlParams.get('partnerOrderNo'),
                notifyUrl: urlParams.get('notifyUrl'),
                externalOrderNo: urlParams.get('externalOrderNo'),
                envVersion: urlParams.get('env') || 'release'
            };
        }

        function getHashParams() {
            if (!window.location.hash) return {};
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            return {
                timestamp: hashParams.get('timestamp') || hashParams.get('ts'),
                nonceStr: hashParams.get('nonceStr') || hashParams.get('nonce'),
                signature: hashParams.get('signature') || hashParams.get('sig'),
                appId: hashParams.get('appId') || hashParams.get('appid')
            };
        }

        function getAllParams() {
            return { ...getQueryParams(), ...getHashParams() };
        }

        function buildMiniProgramPath(params) {
            const queryParams = [];
            let path = 'pages/index/index';

            if (params.productId) {
                path = 'pages/product/detail/detail';
                queryParams.push(`id=${params.productId}`);
            }
            if (params.linkCode) queryParams.push(`link=${params.linkCode}`);
            if (params.partnerOrderNo) queryParams.push(`order=${params.partnerOrderNo}`);
            if (params.notifyUrl) queryParams.push(`notify=${encodeURIComponent(params.notifyUrl)}`);
            if (params.externalOrderNo) queryParams.push(`external_order_no=${params.externalOrderNo}`);

            return queryParams.length ? `${path}?${queryParams.join('&')}` : path;
        }

        function initSdk(params) {
            if (!params.signature || !params.timestamp || !params.nonceStr) {
                showError('缺少微信签名参数，请检查链接');
                return Promise.reject(new Error('missing params'));
            }

            return new Promise((resolve, reject) => {
                wx.config({
                    debug: false,
                    appId: params.appId,
                    timestamp: Number(params.timestamp),
                    nonceStr: params.nonceStr,
                    signature: params.signature,
                    jsApiList: ['checkJsApi', 'miniProgram', 'navigateToMiniProgram']
                });

                wx.ready(() => {
                    state.jsSdkReady = true;
                    resolve();
                });

                wx.error(err => {
                    showError('微信鉴权失败：' + err.errMsg);
                    reject(err);
                });
            });
        }

        function jumpToMiniProgram() {
            if (!state.params) state.params = getAllParams();

            if (!/MicroMessenger/i.test(navigator.userAgent)) {
                showError('当前环境无法调起小程序，请在微信内打开此链接');
                return;
            }

            if (typeof wx === 'undefined' || !wx.miniProgram) {
                showError('微信JS-SDK未就绪，请在微信内打开');
                return;
            }

            const targetPath = buildMiniProgramPath(state.params);
            console.log('准备跳转', {
                appId: state.params.appId,
                path: targetPath,
                envVersion: state.params.envVersion
            });

            wx.miniProgram.navigateTo({
                url: `/${targetPath}`,
                success: res => console.log('✅ 跳转成功', res),
                fail: err => {
                    console.error('❌ 跳转失败', err);
                    showError('跳转失败：' + err.errMsg);
                }
            });
        }

        function showError(message) {
            document.getElementById('errorMsg').textContent = message;
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('retryBtn').style.display = 'inline-block';
            document.querySelector('.loading').style.display = 'none';
        }

        function showCopyGuide() {
            const container = document.querySelector('.jump-container');
            const url = window.location.href;
            container.innerHTML = `
                <div class="title">请在微信中打开</div>
                <div class="subtitle">复制下方链接到微信聊天窗口，或发送给朋友后点击即可进入小程序</div>
                <div style="word-break: break-all; background: rgba(255,255,255,0.15); padding: 12px; border-radius: 12px;">${url}</div>
                <button class="retry-btn" style="margin-top:24px;" onclick="copyCurrentLink()">复制链接</button>
                <div style="margin-top:16px; font-size:14px; opacity:0.8;">复制完成后，打开微信 → 粘贴到聊天框 → 点击链接即可继续支付</div>
            `;
        }

        function copyCurrentLink() {
            const text = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('链接已复制，请到微信中粘贴并打开');
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('链接已复制，请到微信中粘贴并打开');
        }

        function retryJump() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('retryBtn').style.display = 'none';
            document.querySelector('.loading').style.display = 'block';
            start();
        }

        async function start() {
            state.params = getAllParams();
            console.log('URL 参数', state.params);

            if (!state.params.linkCode) {
                showError('缺少 linkCode 参数');
                return;
            }

            const isWechat = /MicroMessenger/i.test(navigator.userAgent);
            if (!isWechat) {
                showCopyGuide();
                return;
            }

            try {
                await initSdk(state.params);
                jumpToMiniProgram();
            } catch (err) {
                console.error('初始化失败', err);
            }
        }

        window.onload = start;
    </script>
</body>
</html>
