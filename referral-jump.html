<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转到小程序...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .jump-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }
        .loading {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .title {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .subtitle {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .retry-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="jump-container">
        <div class="loading"></div>
        <div class="title">正在跳转到小程序</div>
        <div class="subtitle">请稍候，即将进入商城...</div>
        <div id="errorMsg" class="error" style="display: none;">
            跳转失败，请确保在微信环境中打开
        </div>
        <button id="retryBtn" class="retry-btn" style="display: none;" onclick="retryJump()">
            重新跳转
        </button>
    </div>

    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script>
        // 从URL参数获取引流信息
        function getUrlParams() {
            const params = {};
            const urlParams = new URLSearchParams(window.location.search);

            // 必需参数
            params.appId = urlParams.get('appId') || 'wx0b1ce2aa786ec457';
            params.productId = urlParams.get('productId');
            params.linkCode = urlParams.get('linkCode');
            params.partnerOrderNo = urlParams.get('partnerOrderNo');
            params.notifyUrl = urlParams.get('notifyUrl');

            // 可选参数
            params.externalOrderNo = urlParams.get('externalOrderNo');

            return params;
        }

        // 构建小程序路径
        function buildMiniProgramPath(params) {
            let path;
            const queryParams = [];

            // 根据是否有商品ID决定跳转页面
            if (params.productId) {
                path = 'pages/product/detail/detail';
                queryParams.push(`id=${params.productId}`);
            } else {
                path = 'pages/index/index'; // 跳转到首页
            }

            if (params.linkCode) queryParams.push(`link=${params.linkCode}`);
            if (params.partnerOrderNo) queryParams.push(`order=${params.partnerOrderNo}`);
            if (params.notifyUrl) queryParams.push(`notify=${encodeURIComponent(params.notifyUrl)}`);
            if (params.externalOrderNo) queryParams.push(`external_order_no=${params.externalOrderNo}`);

            if (queryParams.length > 0) {
                path += '?' + queryParams.join('&');
            }

            return path;
        }

        // 跳转到小程序
        function jumpToMiniProgram() {
            const logMsg = '开始跳转小程序...';
            console.log(logMsg);
            sendLogToServer(logMsg);
            const params = getUrlParams();

            const paramMsg = 'URL参数: ' + JSON.stringify(params);
            console.log(paramMsg);
            // sendLogToServer(paramMsg);

            // 验证必需参数（简化版本）
            if (!params.productId) {
                console.log('没有商品ID，跳转到首页');
                // 没有商品ID时跳转到首页
                params.productId = null;
                params.linkCode = params.linkCode || 'TEST'; // 默认测试码
            }

            if (!params.linkCode) {
                params.linkCode = 'TEST'; // 默认测试码
            }

            // 检查是否在微信环境中
            if (typeof wx === 'undefined') {
                showError('请在微信环境中打开此链接');
                return;
            }

            const path = buildMiniProgramPath(params);

            console.log('准备跳转，参数:', {
                appId: params.appId,
                path: path,
                envVersion: 'trial'
            });

            wx.navigateToMiniProgram({
                appId: params.appId,
                path: path,
                extraData: {
                    source: 'referral',
                    timestamp: Date.now()
                },
                envVersion: 'trial', // 使用体验版
                success: function(res) {
                    console.log('✅ 跳转成功:', res);
                },
                fail: function(err) {
                    console.error('❌ 跳转失败:', err);
                    console.error('错误详情:', JSON.stringify(err));
                    showError('跳转失败: ' + err.errMsg);
                }
            });
        }

        // 显示错误信息
        function showError(message) {
            document.getElementById('errorMsg').textContent = message;
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('retryBtn').style.display = 'inline-block';
            document.querySelector('.loading').style.display = 'none';
        }

        // 重试跳转
        function retryJump() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('retryBtn').style.display = 'none';
            document.querySelector('.loading').style.display = 'block';
            jumpToMiniProgram();
        }

        // 发送日志到服务器
        // function sendLogToServer(logData) {
        //     fetch('https://jxxcfwlkj.cn/api/log/jump', {
        //         method: 'POST',
        //         headers: {
        //             'Content-Type': 'application/json'
        //         },
        //         body: JSON.stringify({
        //             timestamp: new Date().toISOString(),
        //             userAgent: navigator.userAgent,
        //             log: logData
        //         })
        //     }).catch(err => {
        //         console.log('发送日志失败:', err);
        //     });
        // }

    // 页面加载完成后自动跳转
        window.onload = function() {
            const logMsg = '页面加载完成，微信JS-SDK状态: ' + typeof wx;
            console.log(logMsg);
            // sendLogToServer(logMsg); // 临时禁用日志

            if (typeof wx !== 'undefined') {
                console.log('微信JS-SDK已加载');
                // sendLogToServer('微信JS-SDK已加载');
            } else {
                const errorMsg = '微信JS-SDK未加载，请在微信环境中打开';
                console.error(errorMsg);
                // sendLogToServer(errorMsg);
                showError('微信JS-SDK未加载，请在微信环境中打开');
                return;
            }

            // 延迟500ms确保微信JS-SDK加载完成
            setTimeout(jumpToMiniProgram, 500);
        };
    </script>
</body>
</html>
